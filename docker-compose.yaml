version: "3.9"
services:
  app:
    build: .
    image: "moj-copilot-ai-credits-dashboard"
    container_name: "moj-copilot-ai-credits-dashboard"
    environment:
      # GitHub
      ADMIN_GITHUB_TOKEN: fake

      # Flask
      APP_SECRET_KEY: dev
      FLASK_DEBUG: true

      # Auth0
      AUTH_DISABLED: true

      # Sentry
      # SENTRY_DSN_KEY:
      SENTRY_ENV: local

      # App
      LOGGING_LEVEL: "DEBUG"
      REPORTS_CACHE_TTL: 0 # local dev reads on-disk files; don't cache so edits show at once
    ports:
      - "4567:4567"
