name: "Helm Template"

on:
  pull_request:
    paths:
      - "helm/moj-copilot-ai-credits-dashboard/**"
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  helm-template:
    name: "Helm Template"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [development, production]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Helm template
        id: helm-template
        continue-on-error: true
        run: |
          helm template moj-copilot-ai-credits-dashboard \
            helm/moj-copilot-ai-credits-dashboard \
            --namespace ${KUBE_NAMESPACE} \
            --values=helm/moj-copilot-ai-credits-dashboard/${{ matrix.environment == 'production' && 'values-prod.yaml' || 'values-dev.yaml' }} \
            --set app.deployment.env.AUTH0_CLIENT_ID="MOCK_AUTH0_CLIENT_ID" \
            --set app.deployment.env.AUTH0_CLIENT_SECRET="MOCK_AUTH0_CLIENT_SECRET" \
            --set app.deployment.image.repository=$ECR_REGISTRY/$ECR_REPOSITORY \
            --set app.deployment.image.tag=$IMAGE_TAG \
            --set app.deployment.env.APP_SECRET_KEY="MOCK_FLASK_APP_SECRET" \
            --set app.deployment.athena.database=${ATHENA_DATABASE} \
            --set app.deployment.athena.tableUsers=${ATHENA_TABLE_USERS} \
            --set app.deployment.athena.tableModels=${ATHENA_TABLE_MODELS} \
            --set app.deployment.athena.workgroup=${ATHENA_WORKGROUP}

      - name: Test helm template
        id: helm-template-test
        run: |
          helm template moj-copilot-ai-credits-dashboard \
            helm/moj-copilot-ai-credits-dashboard \
            --namespace "KUBE_NAMESPACE" \
            --values=helm/moj-copilot-ai-credits-dashboard/values-dev.yaml \
            --set app.deployment.env.AUTH0_CLIENT_ID="MOCK_AUTH0_CLIENT_ID" \
            --set app.deployment.env.AUTH0_CLIENT_SECRET="MOCK_AUTH0_CLIENT_SECRET" \
            --set app.deployment.image.repository="ECR_REGISTRY/ECR_REPOSITORY" \
            --set app.deployment.image.tag="IMAGE_TAG" \
            --set app.deployment.env.APP_SECRET_KEY="MOCK_FLASK_APP_SECRET" \
            --set app.deployment.athena.database="ATHENA_DATABASE" \
            --set app.deployment.athena.tableUsers="ATHENA_TABLE_USERS" \
            --set app.deployment.athena.tableModels="ATHENA_TABLE_MODELS" \
            --set app.deployment.athena.workgroup="ATHENA_WORKGROUP"

      - name: Post chart to GitHub PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: helm-template
          message: |
            ## Helm chart template - moj-copilot-ai-credits-dashboard (${{ matrix.environment }})
            ```
            ${{ steps.helm-template.outputs.stdout || steps.helm-template.outputs.stderr }}
            ```
