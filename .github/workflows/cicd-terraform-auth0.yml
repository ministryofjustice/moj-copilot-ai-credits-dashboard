name: "♻️ Terraform Auth0"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "terraform/auth0/**"
    branches:
      - main
  push:
    paths:
      - "terraform/auth0/**"
    branches: ["main"]

env:
  TF_VAR_tf_state_s3_bucket_name: ${{ vars.DEV_S3_BUCKET_NAME }}
  TF_VAR_auth0_domain: ${{ secrets.DEV_AUTH0_DOMAIN }}
  TF_VAR_auth0_client_id: ${{ secrets.DEV_AUTH0_CLIENT_ID }}
  TF_VAR_auth0_client_secret: ${{ secrets.DEV_AUTH0_CLIENT_SECRET }}

jobs:
  terraform:
    name: "Auth0 Terraform"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: "terraform/auth0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e. # v4.0.1
        with:
          terraform_version: "1.15.8"

      - name: Configure AWS credentials for Terraform
        uses: aws-actions/configure-aws-credentials@486457dc46e82b9a740ca0ef1dac6a38a3fc272d # v4.0.2
        with:
          role-to-assume: {${{ secrets.DEV_S3_ROLE_TO_ASSUME }}}
          aws-region: eu-west-2

      - name: Terraform Format Check
        id: fmt-check
        run: terraform fmt -check

      - name: Terraform Init
        id: init
        run: ls -latr; terraform init -input=false -no-color

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -no-color | make -f "$GITHUB_WORKSPACE/Makefile" redact-terraform-output

      - name: Post Plan to GitHub PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
            header: auth0-terraform-plan-results
            message: |
                ## Terraform ${{ inputs.name }} plan
                ```
                ${{ steps.plan.outputs.stdout || steps.plan.outputs.stderr }}
                ```

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        id: apply
        run: terraform apply -input=false -no-color -auto-approve | make -f "$GITHUB_WORKSPACE/Makefile" redact-terraform-output