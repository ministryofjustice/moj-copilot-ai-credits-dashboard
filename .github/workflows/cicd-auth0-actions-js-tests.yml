name: Auth0 Actions - Js Unit Tests

on:
  pull_request:
    paths:
      - 'terraform/auth0/actions_code/**'
  push:
    branches:
      - main
    paths:
      - 'terraform/auth0/actions_code/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/auth0/actions_code
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - run: npm test
      