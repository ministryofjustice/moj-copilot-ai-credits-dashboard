---
name: Snyk

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 1" # Weekly Monday midnight UTC
  workflow_dispatch:

permissions: {}

jobs:
  snyk-python:
    name: Snyk Python
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Pipenv and project dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install --deploy --dev

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Scan Python dependencies
        id: scan
        continue-on-error: true
        run: snyk test --severity-threshold=high --fail-on=upgradable --file=Pipfile --sarif-file-output=snyk-python.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Check for SARIF file
        id: sarif
        if: always() && steps.scan.outcome != 'skipped'
        run: echo "exists=$([ -f snyk-python.sarif ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF
        if: always() && steps.sarif.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: snyk-python.sarif
          category: snyk-python

      - name: Fail on findings
        if: steps.scan.outcome == 'failure'
        run: exit 1

  snyk-container:
    name: Snyk Container
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build image
        run: docker build --tag "${{ github.sha }}" .

      - name: Scan container image
        id: scan
        continue-on-error: true
        uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ github.sha }}
          args: --file=Dockerfile --severity-threshold=high --fail-on=upgradable

      - name: Check for SARIF file
        id: sarif
        if: always() && steps.scan.outcome != 'skipped'
        run: echo "exists=$([ -f snyk.sarif ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF
        if: always() && steps.sarif.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: snyk.sarif
          category: snyk-container

      - name: Fail on findings
        if: steps.scan.outcome == 'failure'
        run: exit 1

  snyk-code:
    name: Snyk Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Scan source code
        id: scan
        continue-on-error: true
        run: snyk code test --severity-threshold=high --sarif-file-output=snyk-code.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Check for SARIF file
        id: sarif
        if: always() && steps.scan.outcome != 'skipped'
        run: echo "exists=$([ -f snyk-code.sarif ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF
        if: always() && steps.sarif.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Fail on findings
        if: steps.scan.outcome == 'failure'
        run: exit 1
