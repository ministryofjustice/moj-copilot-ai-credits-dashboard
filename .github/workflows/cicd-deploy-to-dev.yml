name: "♻️ Deploy to Development Namespace"

on:
  workflow_dispatch:
  push:
    branches: [main]
env:
  # A majority of the secrets generated here come from the cloud-platform-environments repository.
  KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}
  KUBE_NAMESPACE: ${{ secrets.DEV_KUBE_NAMESPACE }}
  KUBE_CERT: ${{ secrets.DEV_KUBE_CERT }}
  KUBE_TOKEN: ${{ secrets.DEV_KUBE_TOKEN }}

  IMAGE_TAG: ${{ github.sha }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY_URL }}
  ECR_REPOSITORY: ${{ vars.DEV_ECR_REPOSITORY }}

  FLASK_APP_SECRET: ${{ secrets.DEV_FLASK_APP_SECRET }}

  AUTH0_CLIENT_ID: ${{ secrets.DEV_AUTH0_CLIENT_ID }}
  AUTH0_CLIENT_SECRET: ${{ secrets.DEV_AUTH0_CLIENT_SECRET }}

  ATHENA_DATABASE: ${{ secrets.DEV_ATHENA_DATABASE }}
  ATHENA_TABLE_USERS: ${{ secrets.DEV_ATHENA_TABLE_USERS }}
  ATHENA_TABLE_MODELS: ${{ secrets.DEV_ATHENA_TABLE_MODELS }}
  ATHENA_WORKGROUP: ${{ secrets.DEV_ATHENA_WORKGROUP }}
  # Development only. Both must be set for the personal page's telemetry
  # section to appear; the production workflow deliberately has neither.
  ATHENA_TABLE_TELEMETRY_USERS: ${{ secrets.DEV_ATHENA_TABLE_TELEMETRY_USERS }}
  ATHENA_TABLE_TELEMETRY_ACTIVITY: ${{ secrets.DEV_ATHENA_TABLE_TELEMETRY_ACTIVITY }}

jobs:
  # Image paths are defined in .github/actions/detect-image-changes.
  # Helm-only (and other non-image) changes skip build-push and reuse the
  # image already running in the cluster.
  detect-image-changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect image-related file changes
        id: detect
        uses: ./.github/actions/detect-image-changes
        with:
          base-strategy: previous-commit
          before: ${{ github.event.before }}

  build-push:
    name: Build and push image
    needs: detect-image-changes
    # Build unless detection explicitly reported no image changes. Any other
    # result (true, empty, unexpected) rebuilds so we never deploy a missing tag.
    if: needs.detect-image-changes.outputs.changed != 'false'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.DEV_ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.DEV_ECR_REGION }}

      - uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
        id: login-ecr
      - run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy-to-dev:
    name: Deploy to development namespace
    needs: [detect-image-changes, build-push]
    if: always() && !cancelled() && needs.detect-image-changes.result == 'success' && (needs.build-push.result == 'success' || needs.build-push.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to the cluster
        run: |
          echo "${KUBE_CERT}" > ca.crt
          kubectl config set-cluster ${KUBE_CLUSTER} --certificate-authority=./ca.crt --server=https://${KUBE_CLUSTER}
          kubectl config set-credentials deploy-user --token=${KUBE_TOKEN}
          kubectl config set-context ${KUBE_CLUSTER} --cluster=${KUBE_CLUSTER} --user=deploy-user --namespace=${KUBE_NAMESPACE}
          kubectl config get-contexts
          kubectl config use-context ${KUBE_CLUSTER}

      - name: Resolve image tag
        env:
          IMAGE_CHANGED: ${{ needs.detect-image-changes.outputs.changed }}
        run: |
          if [ "${IMAGE_CHANGED}" = "false" ]; then
            echo "Image build was skipped; reusing the currently deployed image."
            if ! current_image="$(kubectl get deployment moj-copilot-ai-credits-dashboard \
              --namespace "${KUBE_NAMESPACE}" \
              --output jsonpath='{.spec.template.spec.containers[0].image}')"; then
              echo "::error::Image build was skipped but no existing deployment was found. Trigger a run that includes application image changes."
              exit 1
            fi
            tag="${current_image##*:}"
            if [ -z "${tag}" ] || [ "${tag}" = "${current_image}" ]; then
              echo "::error::Could not determine the currently deployed image tag from '${current_image}'."
              exit 1
            fi
            echo "Reusing image tag ${tag} from ${current_image}"
            echo "IMAGE_TAG=${tag}" >> "${GITHUB_ENV}"
          else
            echo "Using newly built image tag ${IMAGE_TAG}"
          fi

      - name: Deploy helm chart to dev
        run: |
          helm upgrade moj-copilot-ai-credits-dashboard \
            helm/moj-copilot-ai-credits-dashboard \
            --install \
            --force \
            --wait \
            --timeout 10m \
            --namespace ${KUBE_NAMESPACE} \
            --values=helm/moj-copilot-ai-credits-dashboard/values-dev.yaml \
            --set app.deployment.env.AUTH0_CLIENT_ID="${AUTH0_CLIENT_ID}" \
            --set app.deployment.env.AUTH0_CLIENT_SECRET="${AUTH0_CLIENT_SECRET}" \
            --set app.deployment.image.repository=$ECR_REGISTRY/$ECR_REPOSITORY \
            --set app.deployment.image.tag=$IMAGE_TAG \
            --set app.deployment.env.APP_SECRET_KEY=${FLASK_APP_SECRET} \
            --set app.deployment.athena.database=${ATHENA_DATABASE} \
            --set app.deployment.athena.tableUsers=${ATHENA_TABLE_USERS} \
            --set app.deployment.athena.tableModels=${ATHENA_TABLE_MODELS} \
            --set app.deployment.athena.workgroup=${ATHENA_WORKGROUP} \
            --set app.deployment.athena.tableTelemetryUsers="${ATHENA_TABLE_TELEMETRY_USERS}" \
            --set app.deployment.athena.tableTelemetryActivity="${ATHENA_TABLE_TELEMETRY_ACTIVITY}"
