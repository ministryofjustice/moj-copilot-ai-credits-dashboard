name: Detect image-related file changes
description: >
  Compare the files that make up the application container image against a
  previous git ref. Helm, Terraform, tests, docs, and workflow files are
  ignored so chart-only deploys can skip docker build and push.

inputs:
  base-strategy:
    description: >
      deployed-image compares HEAD to the image tag currently running in
      the cluster. Use it for the dev pipeline (push to main and
      workflow_dispatch). It reads KUBE_CERT, KUBE_CLUSTER, KUBE_TOKEN, and
      KUBE_NAMESPACE from the environment and treats the image as changed
      if the deployment, tag, or kubectl call cannot be resolved.
      previous-tag compares HEAD to the most recent tag other than the
      current ref. Use it for the prod pipeline (releases are tags).
    required: true

outputs:
  changed:
    description: '"true" if image-related files changed, otherwise "false".'
    value: ${{ steps.detect.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Detect image-related file changes
      id: detect
      shell: bash
      env:
        BASE_STRATEGY: ${{ inputs.base-strategy }}
      run: bash "${{ github.action_path }}/detect.sh"
