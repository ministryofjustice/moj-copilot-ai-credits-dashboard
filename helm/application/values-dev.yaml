app:
  ingress:
    host: "moj-copilot-ai-credits-dashboard-dev.cloud-platform.service.justice.gov.uk" # This should be changed as appropriate

  deployment:
    replicaCount: 1
    serviceAccountName: "moj-copilot-ai-credits-dashboard-dev"
    env:
      AUTH0_DOMAIN: "check-your-co-pilot-usage-dev.uk.auth0.com"
      SENTRY_ENV: "development"
      FLASK_DEBUG: true
      REPORTS_SOURCE: "s3"
    s3:
      # Confirm against `kubectl get secrets -n moj-copilot-ai-credits-dashboard-dev`.
      # Defaults follow the standard Cloud Platform S3 module output secret.
      secretName: "s3-bucket-output"
      bucketNameKey: "bucket_name"
      prefix: "reports"
      region: "eu-west-2"
    # Athena backend config. Inert until REPORTS_SOURCE is set to "db" above.
    # Fill these in (confirm names against the deployed Glue table) before switching.
    athena:
      database: "" # Glue database holding the ai-credits tables
      tableModels: "" # per-model table (partitioned Parquet from build_credit_rows)
      tableUsers: "" # per-user table (partitioned Parquet from build_credit_rows)
      outputLocation: "" # s3://.../ Athena results staging dir
      workgroup: "primary"
      region: "eu-west-2"
