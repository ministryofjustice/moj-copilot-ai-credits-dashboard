app:
  ingress:
    primaryHost: "moj-copilot-ai-credits-dashboard-dev.cloud-platform.service.justice.gov.uk"

  deployment:
    replicaCount: 1
    serviceAccountName: "moj-copilot-ai-credits-dashboard-dev"
    env:
      AUTH0_DOMAIN: "check-your-co-pilot-usage-dev.uk.auth0.com"
      SENTRY_ENV: "development"
      APP_ENV: "development"
      FLASK_DEBUG: true
      REPORTS_SOURCE: "db"
    # Athena backend config. Inert until REPORTS_SOURCE is set to "db" above.
    # Fill these in (confirm names against the deployed Glue table) before switching.
    athena:
      database: "" # Glue database holding the ai-credits tables
      tableModels: "" # per-model table (partitioned Parquet from build_credit_rows)
      tableUsers: "" # per-user table (partitioned Parquet from build_credit_rows)
      # Telemetry tables — development only. Set at deploy time from the
      # DEV_ATHENA_TABLE_TELEMETRY_USERS and DEV_ATHENA_TABLE_TELEMETRY_ACTIVITY
      # secrets by .github/workflows/cicd-deploy-to-dev.yml. Both must be set
      # for the personal page's telemetry section to appear.
      tableTelemetryUsers: "" # per-person-day telemetry table
      tableTelemetryActivity: "" # per-language/feature telemetry table
      # No outputLocation: Athena uses the workgroup's default output location.
      workgroup: "primary"
      region: "eu-west-2"
