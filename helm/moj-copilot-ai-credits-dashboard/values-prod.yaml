app:
  ingress:
    hosts: 
      - "moj-copilot-ai-credits-dashboard-prod.cloud-platform.service.justice.gov.uk"
      - "check-my-copilot-ai-credits-usage.service.justice.gov.uk"

  deployment:
    replicaCount: 3
    serviceAccountName: "moj-copilot-ai-credits-dashboard-prod"
    env:
      AUTH0_DOMAIN: "check-your-co-pilot-usage-prod.uk.auth0.com"
      SENTRY_ENV: "production"
      APP_ENV: "production"
      FLASK_DEBUG: false
      REPORTS_SOURCE: "db"
      REPORTS_CACHE_TTL: 3600 # seconds; memoise the reads. The Glue crawler refreshes
        # the data once a day (10:00 UTC), so anything shorter just re-queries Athena
        # for data that cannot have changed. 0 disables.
    # Athena backend config (live: REPORTS_SOURCE is "db" above).
    # These are placeholders — the real values are injected at deploy time by
    # .github/workflows/cicd-deploy-to-prod.yml, which --sets them from the
    # PROD_ATHENA_{DATABASE,TABLE_MODELS,TABLE_USERS,WORKGROUP} GitHub secrets.
    # Leave them blank here; do not "fill them in".
    athena:
      database: "" # <- set from secret PROD_ATHENA_DATABASE
      tableModels: "" # <- set from secret PROD_ATHENA_TABLE_MODELS
      tableUsers: "" # <- set from secret PROD_ATHENA_TABLE_USERS
      # No outputLocation: the workgroup pins its own and enforces it.
      workgroup: "primary" # <- overridden by secret PROD_ATHENA_WORKGROUP
      region: "eu-west-2"
