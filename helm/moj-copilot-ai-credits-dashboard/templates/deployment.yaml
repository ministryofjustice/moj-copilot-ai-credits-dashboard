apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "application.fullname" . }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.deployment.replicaCount }}
  selector:
    matchLabels: {{- include "application.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "application.selectorLabels" . | nindent 8 }}
    spec:
      # serviceAccountName created by the Cloud Platform environment
      serviceAccountName: {{ .Values.app.deployment.serviceAccountName }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.app.deployment.image.repository }}:{{ .Values.app.deployment.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: APP_SECRET_KEY
              value: {{ .Values.app.deployment.env.APP_SECRET_KEY | quote }}
            - name: APP_ENV
              value: {{ .Values.app.deployment.env.APP_ENV | quote }}
            - name: FLASK_DEBUG
              value: {{ .Values.app.deployment.env.FLASK_DEBUG | quote }}
            - name: AUTH0_DOMAIN
              value: {{ .Values.app.deployment.env.AUTH0_DOMAIN | quote }}
            - name: AUTH0_CLIENT_ID
              value: {{ .Values.app.deployment.env.AUTH0_CLIENT_ID | quote }}
            - name: AUTH0_CLIENT_SECRET
              value: {{ .Values.app.deployment.env.AUTH0_CLIENT_SECRET | quote }}
            - name: SENTRY_DSN_KEY
              value: {{ .Values.app.deployment.env.SENTRY_DSN_KEY }}
            - name: SENTRY_ENV
              value: {{ .Values.app.deployment.env.SENTRY_ENV }}
            - name: REPORTS_SOURCE
              value: {{ .Values.app.deployment.env.REPORTS_SOURCE | default "local" | quote }}
            - name: REPORTS_CACHE_TTL
              value: {{ .Values.app.deployment.env.REPORTS_CACHE_TTL | default 300 | quote }}
            {{- if eq (.Values.app.deployment.env.REPORTS_SOURCE | default "local") "db" }}
            # Athena backend (DbReportsSource). Dormant until REPORTS_SOURCE=db.
            # Credentials resolve via IRSA (the pod service account) - no keys here.
            - name: ATHENA_DATABASE
              value: {{ .Values.app.deployment.athena.database | quote }}
            - name: ATHENA_TABLE_MODELS
              value: {{ .Values.app.deployment.athena.tableModels | quote }}
            - name: ATHENA_TABLE_USERS
              value: {{ .Values.app.deployment.athena.tableUsers | quote }}
            # Telemetry tables. Empty everywhere they are not configured, which
            # switches the personal page's telemetry section off. Development
            # sets them; production does not.
            - name: ATHENA_TABLE_TELEMETRY_USERS
              value: {{ .Values.app.deployment.athena.tableTelemetryUsers | default "" | quote }}
            - name: ATHENA_TABLE_TELEMETRY_ACTIVITY
              value: {{ .Values.app.deployment.athena.tableTelemetryActivity | default "" | quote }}
            - name: ATHENA_WORKGROUP
              value: {{ .Values.app.deployment.athena.workgroup | default "primary" | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.app.deployment.athena.region | default "eu-west-2" | quote }}
            {{- end }}

          ports:
            - name: http
              containerPort: 80
